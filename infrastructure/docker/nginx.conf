worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  # Do not retain IPs, cookies, query strings or reading identifiers.
  access_log off;
  error_log /dev/stderr crit;
  gzip on;
  gzip_min_length 512;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;
  client_max_body_size 12m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    location = /healthz { return 200 "ok\n"; }
    location ~ (^|/)\. { return 404; }
    location ~ ^/api/(metrics|docs|openapi.json)(/|$) { return 404; }
    location /api/ {
      proxy_pass http://api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 120s;
      proxy_hide_header Server;
    }
    location /assets/ {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /docs { return 301 /docs/; }
    location /docs/assets/ {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /docs/ {
      try_files $uri $uri.html $uri/ /docs/404.html;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      # VitePress emits inline bootstrap/theme scripts. This exception is scoped to docs.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      add_header Cache-Control "no-cache";
    }
    location / {
      try_files $uri $uri/ /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }
  }
}
