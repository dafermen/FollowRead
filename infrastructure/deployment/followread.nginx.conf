# Install as a NEW site after approval; do not replace any existing virtual host.
# HTTP bootstrap for certbot --webroot. Install HTTPS block only after issuing the certificate.
limit_req_zone $binary_remote_addr zone=followread_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=followread_api:2m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name followread.innovalogic.tech;
    location /.well-known/acme-challenge/ { root /var/www/followread-acme; }
    location / { return 308 https://followread.innovalogic.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name followread.innovalogic.tech;
    ssl_certificate /etc/letsencrypt/live/followread.innovalogic.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/followread.innovalogic.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FollowReadTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/followread-error.log crit;
    client_max_body_size 12m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_hide_header Server;

    location ~ (^|/)\. { return 404; }
    location ~ ^/admin/api(/|$) { return 404; }
    location ~ ^/api/(metrics|docs|openapi.json)(/|$) { return 404; }
    location = /api/auth/login {
        limit_req zone=followread_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5180;
    }
    location ^~ /api/auth/password-reset/ {
        limit_req zone=followread_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5180;
    }
    location /api/ {
        limit_req zone=followread_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5180;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ { proxy_pass http://127.0.0.1:5181/; }
    location / { proxy_pass http://127.0.0.1:5180; }
}
