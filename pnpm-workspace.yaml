packages:
  - apps/admin-web
  - apps/reader
  - packages/*

catalog:
  "@capacitor/android": 8.4.2
  "@capacitor/app": 8.1.1
  "@capacitor/assets": 3.0.5
  "@capacitor/cli": 8.4.2
  "@capacitor/core": 8.4.2
  "@capacitor/ios": 8.4.2
  "@capacitor/network": 8.0.1
  "@capacitor/splash-screen": 8.0.2
  "@capacitor/status-bar": 8.0.3
  "@eslint/js": 10.0.1
  "@testing-library/jest-dom": 7.0.0
  "@testing-library/react": 16.3.3
  "@types/node": 26.1.1
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.4
  "@vitest/coverage-v8": 4.1.11
  eslint: 10.7.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.3
  globals: 17.7.0
  jsdom: 29.1.1
  mermaid: 11.16.1
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  typescript-eslint: 8.65.0
  vite: 8.1.5
  vitepress: 1.6.4
  vitepress-plugin-mermaid: 2.0.17
  vitest: 4.1.11
  vue: 3.5.40

catalogMode: strict

allowBuilds:
  # VitePress uses esbuild to compile the static documentation site.
  esbuild: true
  sharp: true

# @capacitor/assets 3.0.5 still declares sharp 0.32, which has no Node 24 binary.
# The current compatible release preserves the API used by the asset generator.
overrides:
  sharp: 0.35.4
  # VitePress 1.x accepts Vite 6; patch only its internal Vite without changing the apps' Vite 8.
  vitepress>vite: 6.4.3
  tar: 7.5.22
  minimatch@3.0.5: 3.1.4
  brace-expansion: 5.0.9
  uuid: 11.1.1
  undici@7: 7.29.0
  dompurify: 3.4.13
  nanoid@3: 3.3.18
  postcss: 8.5.23
  "@xmldom/xmldom": 0.9.12
