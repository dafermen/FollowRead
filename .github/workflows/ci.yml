name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: pnpm setup:python

      - name: Run the project quality gate
        run: pnpm ci

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Validate deployment definitions
        run: pnpm deploy:validate

      - name: Upload web builds
        uses: actions/upload-artifact@v7
        with:
          name: followread-web-${{ github.sha }}
          path: |
            apps/admin-web/dist
            apps/reader/dist
          if-no-files-found: error
          retention-days: 14

  containers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infrastructure/docker/api.Dockerfile
          - name: admin
            dockerfile: infrastructure/docker/admin.Dockerfile
          - name: reader
            dockerfile: infrastructure/docker/reader.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build ${{ matrix.name }} container
        run: >-
          docker build
          --file ${{ matrix.dockerfile }}
          --tag followread-${{ matrix.name }}:${{ github.sha }}
          .
