name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Python environment
        run: python -m venv apps/api/.venv

      - name: Install Python dependencies
        run: apps/api/.venv/bin/python -m pip install -e './apps/api[dev]'

      - name: Run the project quality gate
        run: pnpm ci
