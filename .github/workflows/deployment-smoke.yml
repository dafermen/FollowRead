name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to validate
        type: choice
        required: true
        options:
          - development
          - staging
          - production
      api_url:
        description: Deployed API base URL
        required: true
      admin_url:
        description: Deployed Admin base URL
        required: true
      reader_url:
        description: Deployed Reader base URL
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Validate deployed services
        env:
          FOLLOWREAD_API_URL: ${{ inputs.api_url }}
          FOLLOWREAD_ADMIN_URL: ${{ inputs.admin_url }}
          FOLLOWREAD_READER_URL: ${{ inputs.reader_url }}
        run: node scripts/deployment-smoke-test.mjs
