name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to validate
        type: choice
        required: true
        options:
          - development
          - staging
          - production
      api_url:
        description: Deployed API base URL
        required: true
      admin_url:
        description: Deployed Admin base URL
        required: true
      reader_url:
        description: Deployed Reader base URL
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Validate deployed services
        env:
          FOLLOWREAD_API_URL: ${{ inputs.api_url }}
          FOLLOWREAD_ADMIN_URL: ${{ inputs.admin_url }}
          FOLLOWREAD_READER_URL: ${{ inputs.reader_url }}
        run: node scripts/deployment-smoke-test.mjs
