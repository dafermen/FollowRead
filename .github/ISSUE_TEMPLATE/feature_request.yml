--- BEGIN FILE ---
name: Feature request
description: Propose a traceable improvement for FollowRead
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user's need, not just the solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should the user be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include normal cases, errors, accessibility, and privacy.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Technical impact
      description: Contracts, data, security, performance, deployment, or migrations.

--- END FILE ---
