--- BEGIN FILE ---
name: Bug report
description: Record a reproducible defect in FollowRead
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, tokens, PII, or private content.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what was the expected result?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, app, browser/device, operating system, and environment.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Sanitized logs, request ID, or screenshot without private data.
  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options:
        - I don't know
        - Yes
        - No
    validations:
      required: true

--- END FILE ---
